  --bg: #0c1524; --bg2: #101b2e; --card: #14213a; --card2: #1a2a46; --line: #22324f; --line2: #2d4062;
  --text: #e4dfd2; --muted: #a3abb9; --dim: #8390a4;
  --acc: #9ec5b2; --acc2: #6f9a88; --acc-bg: #18342f; --acc-line: #2f574c;
  --brass: #c9a862; --red: #c9584a; --paper: #e4dfd2;
  --bad: #dd8b7d; --bad-bg: #2c1c22; --warn: #d2b77c; --warn-bg: #2a2619;
  --mark: rgba(158, 197, 178, .22); --gapc: #8fb5a5;
  --t-coll: #9ec5b2; --t-pv: #c9a862; --t-gram: #d98c80;
  --r: 12px; --tab: 60px; --top: 52px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Libre Baskerville", Baskerville, "Baskerville Old Face", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
.hidden { display: none !important; }

/* shell */
#app { display: flex; flex-direction: column; height: 100dvh; }
.top { height: var(--top); flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px; border-bottom: 1px solid var(--line); background: var(--bg2); position: relative; }
.top::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(to bottom, rgba(228, 223, 210, .55) 0 1px, var(--red) 1px 3px, rgba(228, 223, 210, .55) 3px 4px); }
.top .back { width: 44px; height: 44px; border: 0; background: none; border-radius: 10px; font-size: 26px; line-height: 1; color: var(--muted); }
.top .back:active { background: var(--card); }
.top .title { flex: 1; min-width: 0; font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .title small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.top .acts { display: flex; gap: 4px; }
.iconbtn { height: 38px; min-width: 38px; padding: 0 10px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; color: var(--muted); font-size: 13.5px; }
.iconbtn:active { background: var(--card2); }
.panes { flex: 1; min-height: 0; display: flex; }
.rail { display: none; }
.pane { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pane-inner { padding: 14px 14px calc(var(--tab) + 24px); max-width: 760px; margin: 0 auto; }
#app[data-pane="list"] .detail, #app[data-pane="detail"] .list { display: none; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: flex; background: var(--bg2); border-top: 1px solid var(--line); z-index: 20; }
.tabbar button, .rail button { flex: 1; border: 0; background: none; color: var(--dim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; position: relative; }
.tabbar button svg, .rail button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"], .rail button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"]::before { content: ''; position: absolute; top: 0; left: 34%; right: 34%; height: 2px; border-radius: 0 0 2px 2px; background: var(--red); }
.rail button[aria-selected="true"]::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 2px; border-radius: 0 2px 2px 0; background: var(--red); }
.badge { position: absolute; top: 6px; left: 52%; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn-bg); color: var(--warn); font-size: 11px; line-height: 18px; border: 1px solid #4a4128; }
body.typing .tabbar { display: none; }
body.typing .pane-inner { padding-bottom: 24px; }

/* desktop: rail + two panes */
@media (min-width: 900px) {
  .tabbar { display: none; }
  .rail { display: flex; flex-direction: column; width: 76px; flex: 0 0 76px; border-right: 1px solid var(--line); background: var(--bg2); padding-top: 8px; }
  .rail button { flex: 0 0 68px; }
  .badge { left: 56%; }
  #app[data-pane] .list, #app[data-pane] .detail { display: block; }
  .list { flex: 0 0 360px; border-right: 1px solid var(--line); }
  .pane-inner { padding-bottom: 32px; }
  .top .back { visibility: hidden; }
  body.typing .pane-inner { padding-bottom: 32px; }
}

/* lists */
.sec-h { margin: 20px 4px 8px; font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); font-weight: 400; }
.sec-h:first-child { margin-top: 2px; }
.rows { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; min-height: 52px; }
.row:first-child { border-top: 0; }
.row:active, .row.sel { background: var(--card2); }
.row .n { flex: 0 0 auto; min-width: 34px; height: 28px; padding: 0 6px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13.5px; color: var(--brass); font-variant-numeric: tabular-nums; }
.row .main { flex: 1; min-width: 0; }
.row .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .end { flex: 0 0 auto; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.row .chev { color: var(--dim); }
.sub { padding: 2px 0 6px; }
.sub .row { padding-left: 22px; min-height: 46px; }
.meter { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--acc2); }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }
.note { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--muted); font-size: 14.5px; }
.note.warn { border-color: #4a4128; background: var(--warn-bg); color: var(--warn); }
.note.bad { border-color: #4b302b; background: var(--bad-bg); color: var(--bad); }

/* exercise */
.ex-head { display: flex; align-items: baseline; gap: 10px; margin: 2px 2px 8px; }
.ex-head .lab { font-weight: 700; color: var(--brass); font-variant-numeric: tabular-nums; }
.ex-head .meta { color: var(--dim); font-size: 13px; }
.rubric { font-weight: 600; margin: 0 2px 12px; }
.block { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 10px 14px; margin-bottom: 12px; }
.block .bl { padding: 3px 0; }
.block.opts .bl { border-top: 1px solid var(--line); padding: 6px 0; }
.block.opts .bl:first-child { border-top: 0; }
.block .cap { font-size: 13px; color: var(--dim); margin-bottom: 4px; }
.passage { line-height: 1.75; font-family: var(--serif); font-size: 15.5px; }
.block.passage { max-height: 42vh; overflow-y: auto; position: relative; overscroll-behavior: contain; }
@media (min-width: 900px) { .block.passage { max-height: 56vh; } }
.passage p { margin: 0 0 6px; }
.item { border: 1px solid var(--line2); border-radius: var(--r); background: var(--card); padding: 14px; margin-bottom: 12px; }
.item .num { color: var(--dim); font-family: var(--font); font-variant-numeric: tabular-nums; margin-right: 8px; font-weight: 600; font-size: 15px; }
.item .prompt { font-family: var(--serif); font-size: 17px; line-height: 1.75; }
.item .stem, .item .lead { color: var(--muted); margin-bottom: 6px; }
.item .lead { font-weight: 600; }
.runs .tb { display: inline-block; width: 1.4em; }
.runs u { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.gap { display: inline-block; min-width: 3.2em; width: calc(var(--w, 40) * 0.09em); max-width: 70%; border-bottom: 1.5px dotted var(--gapc); height: 1.05em; vertical-align: -0.2em; margin: 0 2px; }
mark.focus { background: var(--mark); color: var(--text); border-radius: 4px; padding: 0 2px; }
.passage .gap.cur { border-bottom-color: var(--acc); border-bottom-style: solid; }
.answer { margin-top: 12px; }
.answer textarea { width: 100%; min-height: 52px; max-height: 40vh; resize: none; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); font-size: 18px; line-height: 1.4; outline: none; }
.answer textarea:focus { border-color: var(--acc2); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); font-weight: 600; font-size: 15.5px; }
.btn.pri { background: var(--acc-bg); border-color: var(--acc-line); color: #e3efe8; }
.btn.grow { flex: 1; }
.btn:disabled { opacity: .45; }
.btn:active:not(:disabled) { filter: brightness(1.15); }
.result { margin-top: 12px; border-radius: 12px; padding: 10px 14px; border: 1px solid var(--line); background: var(--bg2); }
.result.ok { border-left: 3px solid var(--acc); }
.result.no { border-left: 3px solid var(--bad); }
.card.just .result { animation: rise .22s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.result .verdict { font-weight: 600; margin-bottom: 4px; }
.result.ok .verdict { color: var(--acc); }
.result.no .verdict { color: var(--bad); }
.result .k { color: var(--text); font-family: var(--serif); font-size: 15.5px; line-height: 1.7; }
.result .yours { color: var(--muted); font-size: 14px; margin-top: 6px; }
.result .src { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
.keyall .kl { padding: 2px 0; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.dots button { min-width: 34px; height: 30px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.dots button.cur { border-color: var(--acc2); color: var(--text); }
.dots button.ok { background: var(--acc-bg); }
.dots button.no { background: var(--bad-bg); }
.dots button.held { opacity: .4; text-decoration: line-through; }
.navrow { display: flex; gap: 8px; margin-top: 4px; }
.navrow .btn { flex: 1; font-weight: 500; }
.kbd { font-size: 12px; color: var(--dim); margin-top: 14px; }
kbd { font: 11.5px var(--font); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }

/* library */
.imp { display: flex; flex-direction: column; gap: 10px; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }
table.stats { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.stats th, table.stats td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats th { color: var(--dim); font-weight: 600; font-size: 12px; }
table.stats tr.tot td { font-weight: 700; border-bottom: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }

/* page viewer */
.viewer { position: fixed; inset: 0; background: rgba(7, 13, 23, .97); z-index: 50; display: flex; flex-direction: column; }
.viewer .vtop { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.viewer .vtop .t { flex: 1; color: var(--muted); font-size: 14px; }
.viewer .vbody { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 10px; text-align: center; }
.viewer canvas, .review-page canvas { background: #fff; border-radius: 4px; max-width: none; }
.review-page { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: #08111e; margin-bottom: 12px; text-align: center; padding: 6px; max-height: 62vh; }
.seg.books { display: flex; margin: 2px 0 6px; }
.seg.books button { flex: 1; height: 40px; font-size: 14.5px; }
.seg.books.many { flex-wrap: wrap; }
.seg.books.many button { flex: 1 1 45%; }
.lc { text-decoration: underline dotted; text-decoration-color: var(--warn); text-underline-offset: 3px; }
.ocrmark { color: var(--warn); }
.ocrnote { margin-top: 6px; font-size: 13px; color: var(--muted); }
.ocrnote a { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 0 12px; height: 36px; color: var(--muted); font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--card2); color: var(--text); }
.failline { background: var(--bad-bg); border-left: 3px solid var(--bad); padding-left: 8px; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line2); border-top-color: var(--acc); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -3px; }
@keyframes sp { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab) + 18px); transform: translateX(-50%); background: var(--card2); border: 1px solid var(--line2); padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; max-width: 90vw; }
@media (min-width: 900px) { .toast { bottom: 24px; } }

/* practice: Today, cards, Stats */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.chip { height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line2); background: var(--card); color: var(--muted); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--acc-bg); border-color: var(--acc-line); color: var(--text); }
.chip:disabled { opacity: .4; }
.note.resume { display: flex; flex-direction: column; gap: 4px; border-color: var(--acc-line); background: var(--acc-bg); color: var(--text); margin-bottom: 6px; }
.card { margin-bottom: 10px; }
.cmeta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 0 2px 10px; font-size: 13px; color: var(--dim); }
.cmeta .skill { color: var(--acc); font-weight: 700; font-size: 13.5px; }
.cmeta .where { flex: 1; min-width: 0; }
.cmeta .cbtns { display: flex; gap: 6px; }
.cmeta .iconbtn { height: 32px; font-size: 12.5px; }
.tagq { color: var(--warn); }
.sbar { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12.5px; margin: 6px 2px; }
.sbar .meter { flex: 1; margin: 0; }
.sbar .meter i { background: var(--brass); }
.sbar #vstate { color: var(--acc); }
.flagf { border: 1px solid #4a4128; background: var(--warn-bg); border-radius: var(--r); padding: 10px 12px; margin-bottom: 12px; }
.flagf .cap { color: var(--warn); font-size: 13px; margin-bottom: 4px; }
.flagf input, .answer .cin { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); font-size: 17px; outline: none; margin-top: 6px; }
.answer .cin:focus { border-color: var(--acc2); }
.optsbar { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; color: var(--dim); font-size: 13px; }
.optsbar .btn { height: 38px; font-size: 14px; }
.prompt.sent { font-family: var(--serif); font-size: 18px; line-height: 1.75; }
.cgap { display: inline-block; min-width: 3em; width: calc(var(--n, 8) * 0.55em); border-bottom: 2px solid var(--acc); height: 1.1em; vertical-align: -0.2em; margin: 0 2px; text-align: center; font-size: 12px; color: var(--acc); line-height: 1.9; }
b.tok { color: var(--acc); }
b.tno { color: var(--bad); }
.veiled { filter: blur(6px); user-select: none; transition: filter .2s; }
.audiobar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 2px 0 6px; }
.audiobar .hint { color: var(--dim); font-size: 13px; }
.btn.mic { height: 56px; font-size: 17px; }
.btn.mic.on { background: #3a2026; border-color: #6a3a3a; color: #f3dcd6; }
.diff { line-height: 1.9; margin: 6px 0; }
.diff .w { padding: 1px 3px; border-radius: 4px; }
.diff .w.miss { color: var(--bad); text-decoration: underline; text-underline-offset: 3px; }
.diff .w.extra { color: var(--dim); text-decoration: line-through; }
.k.sent { margin-top: 6px; }
.result a { color: var(--acc); }
@media (min-width: 900px) { .card .item .prompt { font-size: 18px; } }

/* built-in sets: hint line, first letters, options as chips */
.hintline { margin: 8px 0 10px; color: var(--muted); font-size: 14.5px; }
.hintline .hk { font-family: var(--serif); font-style: italic; color: var(--dim); margin-right: 4px; }
.hintline .cue { color: var(--brass); letter-spacing: .04em; }
.optchips { margin: 0 0 12px; }
.optchips .chip { color: var(--text); }

/* v0.6: the greeting on Today, the colour mark of each set and book, focus, reduced motion */
.hello { margin: 2px 4px 14px; }
.hello .g { display: block; font-family: var(--serif); font-style: italic; font-size: 23px; line-height: 1.3; color: var(--text); }
.hello .d { color: var(--muted); font-size: 14px; }
.mark { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: currentColor; flex: 0 0 auto; }
.t-coll { color: var(--t-coll); } .t-pv { color: var(--t-pv); } .t-gram { color: var(--t-gram); }
.chip .mark, .seg button .mark { margin-right: 7px; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .card.just .result { animation: none; } .veiled, .prog i { transition: none; } }
</style>
</head>
<body>
<div id="app" data-pane="list">
  <header class="top"><button class="back hidden" aria-label="Back">‹</button><div class="title"></div><div class="acts"></div></header>
  <div class="panes"><nav class="rail" aria-label="Sections"></nav><section class="pane list"></section><section class="pane detail"></section></div>
  <nav class="tabbar" aria-label="Sections"></nav>
</div>
<script>
/*<core>*/
// English Refinery core: PDF extraction, parser profiles, verbatim check, answer check.
// Layout logic only. No book text lives in this code: every book string the app shows is read
// from the user's own PDF at import time. The built-in sets (written by Claude) are parsed here
// from the app's content block by parseSet.
var ER = (function () {
  'use strict';
  var PARSER_VERSION = '0.4.0';
  var GAP = ''; // structural placeholder for a printed gap (dotted line); never stored as text
  var ID6 = [1, 0, 0, 1, 0, 0];
  var BODY = 10;      // body size of the active profile

  // ---------------------------------------------------------------- geometry & fonts
  function mul(m, n) {
    return [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3],
      m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  }
  function ap(m, x, y) { return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]; }
  function six(a) { var m = (a && a.length === 1) ? a[0] : a; return [+m[0], +m[1], +m[2], +m[3], +m[4], +m[5]]; }

  function fontInfo(name) {
    var ps = String(name || '').replace(/^[A-Z]{6}\+/, '');
    var k = ps.lastIndexOf('-');
    var fam = k > 0 ? ps.slice(0, k) : ps;
    var s = k > 0 ? ps.slice(k + 1) : ps;
    return {
      ps: ps, fam: fam,
      bold: /bold|black|heavy|semibold|demi|extrabold|ultra/i.test(s),
      italic: /italic|oblique/i.test(s) || /It$|It(?=[A-Z])/.test(s)
    };
  }

  // whitespace-free form used by the verbatim check (both sides get the same treatment)
  function squash(s) { return String(s).replace(/[\s ­ -​  　﻿]+/g, '').split(GAP).join(''); }

  // ---------------------------------------------------------------- operator-list walker
  // Reproduces pdf.js canvas text positioning to get every glyph's page position, font and
  // style, plus vector marks the layout depends on: thin horizontal rules (underline, strike,
  // dotted answer gaps), vertical separators (table and box edges) and small squares (grids).
  function walkOps(ol, OPS, getFont, normalize) {
    var glyphs = [], rules = [], vrules = [], squares = [], occ = [], rotated = 0, seq = 0;
    var st = { ctm: ID6, tm: ID6, x: 0, y: 0, lx: 0, ly: 0, font: null, fs: 0, fdir: 1, cs: 0, ws: 0, hs: 1, lead: 0, rise: 0, mode: 0, lw: 1, dash: false, ca: 1, bm: 'source-over', clipBox: null, clipOdd: false, clipNext: false };
    var stack = [], fonts = new Map();
    function clone(s) { var o = {}; for (var k in s) o[k] = s[k]; return o; }
    function setFont(id, size) {
      var f = fonts.get(id);
      if (!f) {
        var obj = getFont(id);
        f = { info: fontInfo(obj && obj.name), fm: (obj && obj.fontMatrix) || [0.001, 0, 0, 0.001, 0, 0], vertical: !!(obj && obj.vertical) };
        fonts.set(id, f);
      }
      st.font = f;
      if (size < 0) { st.fdir = -1; size = -size; } else st.fdir = 1;
      st.fs = size;

    S.importing.stage = 'Reading the scan (OCR)' + (per && left ? ' · about ' + Math.max(1, Math.round((per * left) / 60000)) + ' min left' : '');
    paintImport();
  };
  const run = async (list) => {
    const todo = list.filter((n) => !done(n));
    if (!todo.length) return;
    if (!workers) { S.importing.stage = 'Starting the OCR engine'; paintImport(); workers = await ocrPool(nw); }
    let next = 0;
    await Promise.all(workers.map(async (w) => {
      while (next < todo.length) {
        const n = todo[next++];
        const img = await (rendering = rendering.then(() => renderForOcr(doc, n), () => renderForOcr(doc, n)));
        try {
          const ts = performance.now();
          let rec = have.get(n);
          if (!rec) {
            const { data } = await w.recognize(img.blob, {}, { blocks: true, text: false, hocr: false, tsv: false });
            rec = Object.assign({ k: prefix + n, n, view: img.view, w: img.w, h: img.h, sc: img.sc }, packOcr(data, img.sc));
          }
          const an = ER.analyzePage(img.ctx.getImageData(0, 0, img.w, img.h), img.w, img.h, img.sc, OCR_DPI, rec.words, rec.lines);
          rec.gaps = an.gaps;
          rec.rec = await recoverLabels(w, img.cv, an.labels, img.sc);
          rec.xv = OCRX_VER;
          rec.ms = Math.round(performance.now() - ts);
          await DB.put('ocr', rec);
          have.set(n, rec);
          finished++;
          show();
        } finally { img.cv.width = img.cv.height = 0; }
      }
    }));
  };
  show();
  try {
    const head = [];
    for (let n = 1; n <= Math.min(N, 14); n++) head.push(n);
    await run(head);
    if (!ER.detectProfile(head.map((n) => ocrPageModel(have.get(n))), {})) {
      throw new Error('This scanned PDF does not match a parser profile. Scanned books: ' + ER.OCR_PROFILES.map((p) => p.name).join(', ') + '.');
    }
    const rest = [];
    for (let n = head.length + 1; n <= N; n++) rest.push(n);
    await run(rest);
  } finally {
    if (workers) for (const w of workers) { try { await w.terminate(); } catch (e) { /* gone */ } }
  }
  const out = [];
  for (let n = 1; n <= N; n++) out.push(ocrPageModel(have.get(n)));
  return out;
}
const PV = { src: null, doc: null };
async function pdfDoc(src) {
  if (PV.src === src && PV.doc) return PV.doc;
  const f = await DB.get('files', src);
  if (!f) throw new Error('The PDF is not stored on this device. Import it again.');
  const lib = await loadPdfjs();
  if (PV.doc) { try { await PV.doc.destroy(); } catch (e) {} }
  PV.doc = await lib.getDocument({ data: new Uint8Array(await f.blob.arrayBuffer()), isEvalSupported: false, verbosity: 0 }).promise;
  PV.src = src;
  return PV.doc;
}
async function renderPage(canvas, src, pgNo, boxes, cssWidth) {
  const doc = await pdfDoc(src);
  const page = await doc.getPage(pgNo);
  const v1 = page.getViewport({ scale: 1 });
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const vp = page.getViewport({ scale: (cssWidth / v1.width) * dpr });
  canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
  canvas.style.width = Math.floor(vp.width / dpr) + 'px'; canvas.style.height = Math.floor(vp.height / dpr) + 'px';
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  let firstTop = null;
  for (const b of boxes || []) {
    const [x0, y0, x1, y1] = b.bb;
    const p0 = vp.convertToViewportPoint(x0, y1), p1 = vp.convertToViewportPoint(x1, y0);
    ctx.fillStyle = b.bad ? 'rgba(195,90,70,0.16)' : 'rgba(80,140,110,0.13)';
    ctx.strokeStyle = b.bad ? 'rgba(190,70,50,0.95)' : 'rgba(60,120,90,0.9)';
    ctx.lineWidth = 2 * dpr;
    ctx.fillRect(p0[0], p0[1], p1[0] - p0[0], p1[1] - p0[1]);
    ctx.strokeRect(p0[0], p0[1], p1[0] - p0[0], p1[1] - p0[1]);
    if (firstTop === null || p0[1] < firstTop) firstTop = p0[1];
  }
  page.cleanup();
  return firstTop === null ? 0 : firstTop / dpr;
}

// ---------------------------------------------------------------- import
async function importFile(file) {
  if (S.importing && !S.importing.error) return;
  S.importing = { stage: 'Loading the PDF engine', n: 0, total: 0, name: file.name };
  S.lastImport = null;
  render();
  let wake = null;
  try {
    try { wake = navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch (e) { wake = null; }
    const lib = await loadPdfjs();
    S.importing.stage = 'Opening'; paintImport();
    const bytes = new Uint8Array(await file.arrayBuffer());
    const hash = await sha256(bytes);              // before pdf.js takes the buffer
    const doc = await lib.getDocument({ data: bytes, isEvalSupported: false, disableFontFace: true, verbosity: 0 }).promise;
    S.importing.total = doc.numPages; S.importing.stage = 'Reading pages';
    const col = ER.makeCollector();
    const t0 = performance.now();
    let scanned = false;
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      col.add(await ER.extractPage(page, lib, 10));
      page.cleanup();
      S.importing.n = n; paintImport();
      if (n % 3 === 0) await new Promise((r) => setTimeout(r, 0));
      // no text layer on the first pages: a scan
      if (n === Math.min(12, doc.numPages) && !col.pages.some((pg) => pg.hasText)) { scanned = true; break; }
    }
    let title = '';
    try { const md = await doc.getMetadata(); title = (md && md.info && md.info.Title) || ''; } catch (e) {}
    const pages = scanned ? await ocrDocument(doc, hash) : col.pages;
    await doc.destroy();
    S.importing.stage = 'Parsing'; paintImport();
    await new Promise((r) => setTimeout(r, 0));
    const P = ER.detectProfile(pages, { title });
    if (!P) throw new Error('This PDF does not match a parser profile. Profiles: ' + ER.PROFILES.concat(ER.OCR_PROFILES).map((p) => p.name).join(', ') + '.');
    const book = ER.parseBook(pages, P);
    S.importing.stage = 'Saving'; paintImport();
    await saveLibrary(book, file, doc.numPages, Math.round(performance.now() - t0), P, hash);
    const sess = await loadAll();
    void sess;
    try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) {}
    S.importing = null;
    S.lastImport = book.src;
    S.book = book.src; S.openUnit = null;
    toast('Imported: ' + book.exercises.length + ' exercises, ' + book.items.length + ' items.');
  } catch (e) {
    console.error(e);
    S.importing = { error: e && e.message ? e.message : String(e) };
  } finally {
    try { if (wake) await wake.release(); } catch (e) {}
  }
  render();
}
async function saveLibrary(book, file, numPages, ms, P, hash) {
  const src = book.src, lo = src + '/', hi = src + '/￿';
  const tot = { exercises: 0, items: 0, withKey: 0, failures: 0, auto: 0, model: 0, self: 0 };
  Object.values(book.perUnit).forEach((s) => { for (const k in tot) tot[k] += s[k] || 0; });
  tot.sents = (book.sents || []).length;
  tot.cloze = (book.sents || []).filter((q) => q.cloze).length;
  await DB.tx(['units', 'exercises', 'items', 'sents', 'meta', 'files'], 'readwrite', (t) => {
    for (const s of ['units', 'exercises', 'items', 'sents']) t.objectStore(s).delete(KeyRange.bound(lo, hi));
    for (const u of Object.values(book.units)) t.objectStore('units').put({ id: src + '/' + u.u, src, u: u.u, title: u.title, pg: u.pg, printed: u.printed, label: u.label || null, word: u.word || null });
    for (const e of book.exercises) t.objectStore('exercises').put(e);
    for (const i of book.items) t.objectStore('items').put(i);
    for (const q of book.sents || []) t.objectStore('sents').put(q);
    t.objectStore('files').put({ src, name: file.name, size: file.size, lastModified: file.lastModified, blob: file, t: Date.now() });
    t.objectStore('meta').put({ k: 'lib:' + src, src, profile: P.id, name: P.name, short: P.short, parser: book.parser, app: APP_VERSION, t: Date.now(), ms, hash, ocr: !!book.ocr,
      file: { name: file.name, size: file.size }, pages: numPages, perUnit: book.perUnit, stats: book.stats, tot });
  });
}

// ---------------------------------------------------------------- library file
// Moves a parsed book to another device without parsing (or OCR) there: the library, the OCR
// cache of a scanned book, and the PDF itself for the page images. Progress stays per device.
const LIB_MAGIC = 'ERLIB1\n';
async function exportLibrary(src) {
  const L = S.libs.find((l) => l.src === src); if (!L) return;
  toast('Preparing the library file…', 8000);
  try {
    const [units, exercises, items, sents, f] = await Promise.all([DB.range('units', src + '/'), DB.range('exercises', src + '/'), DB.range('items', src + '/'), DB.range('sents', src + '/'), DB.get('files', src)]);
    if (!f) throw new Error('The PDF is not stored on this device.');
    const ocr = L.ocr && L.hash ? await DB.range('ocr', L.hash + '/' + OCR_KEY + '/') : [];
    const head = { v: 1, app: APP_VERSION, parser: L.parser, src, meta: L, units, exercises, items, sents, ocr, file: { name: f.name, size: f.size, lastModified: f.lastModified } };
    const json = new TextEncoder().encode(JSON.stringify(head));
    const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, json.length, true);
    const blob = new Blob([LIB_MAGIC, len, json, f.blob], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'english-refinery-' + src + '.erlib';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    toast('Saved ' + a.download + ' (' + (blob.size / 1048576).toFixed(0) + ' MB).');
  } catch (e) { toast('Export failed: ' + e.message, 6000); }
}
async function importLibraryFile(file) {
  if (S.importing && !S.importing.error) return;
  S.importing = { stage: 'Reading the library file', n: 0, total: 0, name: file.name };
  S.lastImport = null;
  render();
  try {
    const buf = await file.arrayBuffer(), M = LIB_MAGIC.length;
    if (buf.byteLength < M + 4 || new TextDecoder().decode(new Uint8Array(buf, 0, M)) !== LIB_MAGIC) throw new Error('This is not an English Refinery library file.');
    const len = new DataView(buf, M, 4).getUint32(0, true);
    const head = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, M + 4, len)));
    if (head.v !== 1 || !head.src || !head.file) throw new Error('This library file has an unknown format.');
    const pdf = new Blob([new Uint8Array(buf, M + 4 + len)], { type: 'application/pdf' });
    if (pdf.size !== head.file.size) throw new Error('The library file is incomplete.');
    S.importing.stage = 'Saving'; paintImport();
    const src = head.src;
    await DB.tx(['units', 'exercises', 'items', 'sents', 'meta', 'files', 'ocr'], 'readwrite', (t) => {
      for (const n of ['units', 'exercises', 'items', 'sents']) t.objectStore(n).delete(KeyRange.bound(src + '/', src + '/\uffff'));
      for (const u of head.units) t.objectStore('units').put(u);
      for (const e of head.exercises) t.objectStore('exercises').put(e);
      for (const i of head.items) t.objectStore('items').put(i);
      for (const q of head.sents || []) t.objectStore('sents').put(q);
      for (const r of head.ocr || []) t.objectStore('ocr').put(r);
      t.objectStore('files').put({ src, name: head.file.name, size: head.file.size, lastModified: head.file.lastModified, blob: pdf, t: Date.now() });
      t.objectStore('meta').put(Object.assign({}, head.meta, { k: 'lib:' + src, src, viaFile: Date.now() }));
    });
    await loadAll();
    try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) {}
    S.importing = null; S.lastImport = src; S.book = src; S.openUnit = null;
    toast('Library imported: ' + head.exercises.length + ' exercises, ' + head.items.length + ' items.');
  } catch (e) {
    console.error(e);
    S.importing = { error: e && e.message ? e.message : String(e) };
  }
  render();
}

// ---------- answer handling
function bindAnswer() {
  const ta = $('#answer'); if (!ta) return;
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, innerHeight * 0.4) + 'px'; };
  grow();
  ta.addEventListener('input', () => { grow(); const ui = S.ui[ta.dataset.id]; if (ui) ui.typed = ta.value; S.draft = { id: ta.dataset.id, text: ta.value }; saveSession(); });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.altKey) { e.preventDefault(); const b = $('[data-act="check"]') || $('[data-act="show"]') || $('[data-act="done"]'); if (b) b.click(); }
  });
}
function curItem() { const ex = S.exercises.get(S.exId); return ex ? [ex, exItems(ex)[S.idx]] : [null, null]; }
async function doCheck(kind) {
  const [ex, it] = curItem(); if (!it) return;

function pageViews(ex, it) {

// ---------- review
function reviewEntries() {
  const out = [];
  for (const ex of S.exercises.values()) if (ex.vf && ex.vf.length) out.push(ex);
  for (const it of S.items.values()) if (it.vf && it.vf.length) out.push(it);
  for (const q of S.sents.values()) if (q.vf && q.vf.length) out.push(q);
  for (const r of S.review.values()) {
    if (r.h !== 'user') continue;
    const e = S.items.get(r.id) || S.exercises.get(r.id);
    if (e && !(e.vf && e.vf.length)) out.push(e);
  }
  return out.sort((a, b) => (a.src < b.src ? -1 : a.src > b.src ? 1 : 0) || a.u - b.u || (a.id < b.id ? -1 : 1));
}

function spokenOk(it, ex) {

  const txt = speakParts(it.prompt).filter((x) => x !== null).join(' ');

}

// after a card is drawn: start its audio, put the cursor in place
function afterTodayRender() {
  const c = S.cur;
  if (c) c.just = false;
  if (!c || !S.sess || S.sess.finished || S.pane !== 'detail') return;
  bindCardInputs();
  if (c.phase === 'answer' && !c.played && (c.e.skill === 'dict' || c.e.skill === 'shadow' || c.mode === 'say')) { c.played = true; playCard(); }
  if (isDesktop() && c.phase === 'answer') setTimeout(() => { const el = $('#canswer') || $('.cin'); if (el) el.focus(); }, 0);
}
function bindCardInputs() {
  const ta = $('#canswer');
  if (ta) {
    const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, innerHeight * 0.4) + 'px'; };
    grow();
    ta.addEventListener('input', () => {
      grow();
      const c = S.cur; if (!c) return;
      c.typed = ta.value;
      // dictation: the time that counts is until the first key (recall), not the typing
      if (c.firstKey === undefined && c.runAt !== null && c.runAt !== undefined) c.firstKey = c.ms + (performance.now() - c.runAt);
    });
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.altKey) { e.preventDefault(); const b = $('[data-act="ccheck"]') || $('[data-act="cdict"]') || $('[data-act="cshow"]') || $('[data-act="cgot"]'); if (b) b.click(); } });
  }
  $$('.cin').forEach((inp, i, all) => {
    inp.addEventListener('input', () => { if (S.cur) { S.cur.vals = S.cur.vals || []; S.cur.vals[+inp.dataset.k] = inp.value; } });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (i < all.length - 1) all[i + 1].focus(); else { const b = $('[data-act="ccloze"]'); if (b) b.click(); } } });
  });
}
async function playCard(slow) {
  const c = S.cur; if (!c) return;
  const rate = slow ? Math.max(0.6, settings().rate - 0.25) : settings().rate;
  tick(true);
  if (c.e.skill === 'ex') await say(speakParts(c.o.it.prompt).concat(c.o.it.hint ? [c.o.it.hint] : []), rate);
  else await say([c.o.q.text], rate);
  // the clock runs from the end of the audio
  if (S.cur === c && c.phase === 'answer') { c.runAt = performance.now(); }
}

// ---------------------------------------------------------------- Today: answers
function checkEx() {
  const c = S.cur; if (!c) return;
  const ta = $('#canswer'); c.typed = ta ? ta.value.trim() : c.typed;
  if (!c.typed) { toast('Type an answer first, or Show key.'); return; }
  const ok = !!ER.checkAnswer(c.typed, c.o.it.cands || []);
  gradeCard(ok, 'auto');
}
function checkCloze() {
  const c = S.cur; if (!c) return;
  const q = c.o.q;
  c.vals = $$('.cin').map((i) => i.value.trim());
  if (!c.vals.some((v) => v)) { toast('Type the missing words, or Show.'); return; }
  const per = q.targets.map((t, i) => ER.clozeOk(c.vals[i] || '', t));
  gradeCard(per.every(Boolean), 'auto', { per });
}
function checkDict() {
  const c = S.cur; if (!c) return;
  const ta = $('#canswer'); c.typed = ta ? ta.value.trim() : c.typed;
  if (!c.typed) { toast('Type what you heard, or Show.'); return; }
  const d = ER.wordDiff(c.o.q.text, c.typed);
  const slips = d.missed + d.extra;
  gradeCard(slips <= Math.floor(d.expected / 12), 'auto', { diff: d });
}
async function speakAnswer() {
  const c = S.cur; if (!c || c.phase !== 'answer' || VOICE.listening) return;
  c.srErr = null;
  tick(true);
  const r = await listen();
  if (S.cur !== c) return;
  tick(false);
  if (r.error) { c.srErr = r.error; render(); return; }
  c.heard = r.alts;
  if (c.e.skill === 'ex') {
    const ok = r.alts.some((a) => ER.checkAnswer(a, c.o.it.cands || []));
    gradeCard(ok, 'auto');
  } else {
    const best = r.alts.map((a) => ER.wordDiff(c.o.q.text, a)).sort((x, y) => y.score - x.score)[0];
    if (c.phase === 'answer') gradeCard(best.score >= 0.85, 'auto', { diff: best });
  }
}
async function shadowAgain() {
  const c = S.cur; if (!c) return;
  c.tries = (c.tries || 0) + 1;
  await playCard();
  const r = await listen();
  if (S.cur !== c) return;
  if (r.error) { toast(srErrorText(r.error)); return; }
  c.heard = r.alts;
  c.res = Object.assign({}, c.res, { diff: r.alts.map((a) => ER.wordDiff(c.o.q.text, a)).sort((x, y) => y.score - x.score)[0], how: 'auto', ok: c.res.ok });
  render();
}

// ---------------------------------------------------------------- progress file
async function exportProgress() {
  const [cards, progress, flags, review] = await Promise.all(['cards', 'progress', 'flags', 'review'].map((s) => DB.all(s)));
  const data = { app: 'english-refinery', kind: 'progress', v: 1, t: Date.now(), appVersion: APP_VERSION, cards, progress, flags, review, days: S.days, settings: settings() };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'english-refinery-progress-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast('Saved ' + a.download + '.');
}
async function importProgress(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'english-refinery' || data.kind !== 'progress') throw new Error('This is not an English Refinery progress file.');
    const newer = (a, b) => (a.last || 0) - (b.last || 0) || (a.seen || 0) - (b.seen || 0);
    let nc = 0;
    await DB.tx(['cards', 'progress', 'flags', 'review', 'meta'], 'readwrite', (t) => {
      for (const c of data.cards || []) { const mine = S.cards.get(c.id); if (!mine || newer(c, mine) > 0) { t.objectStore('cards').put(c); nc++; } }
      for (const p of data.progress || []) {
        const mine = S.progress.get(p.id);
        if (!mine) { t.objectStore('progress').put(p); continue; }
        const seen = new Set(mine.hist.map((h) => h.t)), hist = mine.hist.concat(p.hist.filter((h) => !seen.has(h.t))).sort((a, b) => a.t - b.t).slice(-40);
        t.objectStore('progress').put({ id: p.id, n: hist.length, hist, last: hist[hist.length - 1] });
      }
      for (const f of data.flags || []) if (!S.flags.has(f.id)) t.objectStore('flags').put(f);
      for (const r of data.review || []) { const mine = S.review.get(r.id); if (!mine || (r.t || 0) > (mine.t || 0)) t.objectStore('review').put(r); }
      const days = Object.assign({}, S.days);
      for (const [d, x] of Object.entries(data.days || {})) { const m = days[d]; if (!m || x.n > m.n) days[d] = x; }
      t.objectStore('meta').put({ k: 'days', days });
    });
    await loadAll();
    toast('Progress merged: ' + nc + ' card' + (nc === 1 ? '' : 's') + ' updated.');
  } catch (e) { toast('Import failed: ' + e.message, 6000); }
  render();
}

// ---------------------------------------------------------------- events of the practice side
function practiceAct(act, a, ev) {
  const c = S.cur;
  switch (act) {
    case 'start': startSession(+a.dataset.min || 10); return true;
    case 'resume': resumeSession(); return true;
    case 'pausesess': pauseSession(); return true;
    case 'endsess': if (S.sess) { S.sess.finished = true; saveSess(); } render(); return true;
    case 'donesess': S.sess = null; DB.put('meta', { k: 'today', sess: null }).catch(() => {}); if (history.state && history.state.er === 'detail') history.back(); else go({ pane: 'list' }); return true;
    case 'skill': { const st = settings(); st.skills[a.dataset.k] = !st.skills[a.dataset.k]; saveSettings(); render(); return true; }
    case 'bookon': { const st = settings(); st.off[a.dataset.src] = !st.off[a.dataset.src]; saveSettings(); render(); return true; }
    case 'lang': settings().lang = a.dataset.k; saveSettings(); render(); return true;
    case 'rate': settings().rate = +a.dataset.k; saveSettings(); render(); return true;
    case 'testvoice': {
      const q = [...S.sents.values()].find((x) => !settings().off[x.src]);
      if (!VOICE.tts) toast('No speech output in this browser.');
      else if (q) say([q.text]); else toast('No sentences yet: re-import a text book.');
      return true;
    }
    case 'ccheck': checkEx(); return true;
    case 'ckey': if (c) { c.typed = ($('#canswer') || {}).value || c.typed; gradeCard(false, 'reveal'); } return true;
    case 'cshow': if (c) { c.typed = ($('#canswer') || {}).value || c.typed; c.shown = true; c.assisted = c.assisted || false; tick(true); render(); } return true;
    case 'cgot': gradeCard(true, 'self'); return true;
    case 'cmiss': gradeCard(false, 'self'); return true;
    case 'coverride': overrideCard(); return true;
    case 'copts': if (c) { c.typed = ($('#canswer') || {}).value || c.typed; c.opts = true; if (c.phase === 'answer') c.assisted = true; render(); } return true;
    case 'copt': { const ta = $('#canswer'); if (c && ta) { ta.value = a.dataset.v; c.typed = a.dataset.v; ta.dispatchEvent(new Event('input')); ta.focus(); } return true; }
    case 'cnext': nextCard(); return true;
    case 'ccloze': checkCloze(); return true;
    case 'cclozekey': if (c) { c.vals = $$('.cin').map((i) => i.value.trim()); gradeCard(false, 'reveal', { per: c.o.q.targets.map(() => false) }); } return true;
    case 'cdict': checkDict(); return true;
    case 'cdictkey': if (c) gradeCard(false, 'reveal'); return true;
    case 'cplay': playCard(); return true;
    case 'cslow': playCard(true); return true;
    case 'cspeak': speakAnswer(); return true;
    case 'cagain': shadowAgain(); return true;
    case 'csee': if (c) { c.seeText = true; render(); } return true;
    case 'ctype': if (c) { stopVoice(); c.mode = 'type'; render(); } return true;
    case 'cpage': case 'ckeypage': {
      if (!c || (c.e.skill === 'ex' ? c.o.it.builtin : c.o.q.builtin)) return true;
      if (c.e.skill === 'ex') { const v = pageViews(c.o.ex, c.o.it); openViewer(v, act === 'ckeypage' && v.length > 1 ? 1 : 0); }
      else openViewer([{ label: 'Page', title: bookShort(c.o.q.src) + ' · p. ' + (c.o.q.printed || c.o.q.pg), src: c.o.q.src, pg: c.o.q.pg, boxes: c.o.q.bb ? [{ bb: c.o.q.bb }] : [] }], 0);
      return true;
    }
    case 'cflag': if (c) { c.flag = !c.flag; render(); } return true;
    case 'flagwhy': if (c) { c.flagWhy = a.dataset.k; c.flagNote = ($('#flagnote') || {}).value || ''; render(); } return true;
    case 'flagsave': saveFlag(); return true;
    case 'flagcancel': if (c) { c.flag = false; render(); } return true;
    case 'unflag': unflag(a.dataset.id); return true;
    case 'shareflags': shareText(flagsText(), 'English Refinery: flags'); return true;
    case 'progexport': exportProgress(); return true;
    case 'sendlog': shareText(errlogText(), 'English Refinery: error log'); return true;
    case 'clearlog': S.errlog = []; DB.put('meta', { k: 'errlog', list: [] }).catch(() => {}); render(); return true;
    case 'openunit': { const [src, u] = a.dataset.id.split('/'); go({ tab: 'ex', book: src, openUnit: src + '/' + u, pane: 'list' }); return true; }
    case 'sentpage': { const q = S.sents.get(a.dataset.id); if (q) openViewer([{ label: 'Page', title: bookShort(q.src) + ' · p. ' + (q.printed || q.pg), src: q.src, pg: q.pg, boxes: q.bb ? [{ bb: q.bb }] : [] }], 0); return true; }
  }
  void ev;
  return false;
}
async function overrideCard() {
  const c = S.cur; if (!c || !c.res || !c.res.prev) return;
  const id = c.e.ref + '#' + c.e.skill, prev = c.res.prev;
  // the answer counts as right after all: graded again from the state before it
  const card = ER.SRS.grade(prev, { ok: true, ms: Math.round(c.ms), day: dayNum(), assisted: c.assisted, practice: c.res.practice });
  card.hist = (prev.hist || []).concat([{ d: dayNum(), ok: 1, ms: Math.round(c.ms), how: 'override' }]).slice(-20);
  S.cards.set(id, card); await DB.put('cards', card);
  if (c.o.it) await record(c.o.it, { ok: true, how: 'override', typed: c.typed });
  const day = dayNum(), dd = S.days[day]; if (dd) { dd.ok++; DB.put('meta', { k: 'days', days: S.days }).catch(() => {}); }
  const rr = S.sess.results[S.sess.results.length - 1]; if (rr && rr.ref === c.e.ref) rr.ok = true;
  S.sess.queue = S.sess.queue.filter((q, i) => i <= S.sess.i || !(q.ref === c.e.ref && q.kind === 'again'));
  c.res = Object.assign({}, c.res, { ok: true, how: 'override', card });
  saveSess(); render();
}
function practiceKey(e) {
  if (!S.sess || !S.cur || S.pane !== 'detail') return false;
  const k = e.key.toLowerCase(), alt = e.altKey;
  const click = (sel) => { const b = $(sel); if (b) { e.preventDefault(); b.click(); return true; } return false; };
  if (alt && k === 'r') return click('[data-act="cplay"]');
  if (alt && k === 's') return click('[data-act="cspeak"]');
  if (alt && k === 'k') return click('[data-act="ckey"]') || click('[data-act="cshow"]') || click('[data-act="cclozekey"]') || click('[data-act="cdictkey"]');
  if (alt && k === 'o') return click('[data-act="copts"]');
  if (alt && k === 'f') return click('[data-act="cflag"]');
  if (alt && k === 'p') return click('[data-act="cpage"]');
  if (e.key === 'Enter' && !alt && !e.shiftKey && document.activeElement && !document.activeElement.matches('textarea, input, button, a')) return click('#nextbtn');
  return false;
}
document.addEventListener('change', (ev) => {
  if (ev.target && ev.target.id === 'progpick') { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (f) importProgress(f); }
});
const PRACTICE = { practicePool, overview, startSession, gradeCard, VOICE, settings, cardsObj, say, listen };

// ---------------------------------------------------------------- error log
// Errors the app hits are kept on the device (last 50) and can be sent from Stats, so that a
// failure on the phone reaches the developer without a screenshot.
function logError(kind, msg, stack) {
  try {
    const e = { t: Date.now(), kind, msg: String(msg || '').slice(0, 300), stack: String(stack || '').split('\n').slice(0, 4).join(' | ').slice(0, 500), v: APP_VERSION, tab: S.tab, ua: navigator.userAgent.slice(0, 160) };
    S.errlog.push(e); if (S.errlog.length > 50) S.errlog = S.errlog.slice(-50);
    DB.put('meta', { k: 'errlog', list: S.errlog }).catch(() => {});
    if (!logError.told) { logError.told = true; toast('Something went wrong; it was logged (Stats → Error log).', 5000); }
  } catch (err) { /* nothing more to do */ }
}
addEventListener('error', (e) => { if (e && e.message) logError('error', e.message, e.error && e.error.stack); });
addEventListener('unhandledrejection', (e) => { const r = e && e.reason; logError('promise', r && r.message ? r.message : String(r), r && r.stack); });

// ---------------------------------------------------------------- boot
(async function boot() {
  let sess = null;
  try { sess = await loadAll(); } catch (e) { document.body.insertAdjacentHTML('afterbegin', '<div class="note bad">Storage unavailable: ' + esc(e.message) + '</div>'); }
  if (sess) {
    Object.assign(S, { tab: sess.tab || 'today', pane: sess.pane || 'list', book: sess.book || null, openUnit: sess.openUnit || null, exId: sess.exId || null, idx: sess.idx || 0, revId: sess.revId || null });
    // after a reload the session waits on Today (Resume): a tap also lets the browser speak again
    if (S.tab === 'today' && S.pane === 'detail') S.pane = 'list';
    if (sess.draft) S.draft = sess.draft;
    if (S.exId && !S.exercises.has(S.exId)) { S.exId = null; S.pane = 'list'; }
  }
  if (!S.libs.length) S.tab = 'lib';
  if (S.pane === 'detail' && !isDesktop()) { history.replaceState({ er: 'root' }, ''); history.pushState({ er: 'detail' }, ''); }
  render();
  setupSW();
  window.__ER_APP = { S, DB, render, importFile, loadAll, version: APP_VERSION, dayNum, practice: PRACTICE };
})();
</script>
